version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: superpm-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: superpm
      POSTGRES_USER: superpm
      POSTGRES_PASSWORD: superpm123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - superpm-network

  # Redis (可选 - 用于缓存和会话管理)
  redis:
    image: redis:7-alpine
    container_name: superpm-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - superpm-network

volumes:
  postgres_data:
  redis_data:

networks:
  superpm-network:
    driver: bridge
